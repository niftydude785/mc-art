<script src="data.js?v=81"></script>
<script src="sources.js?v=81"></script>
<script>
const params = new URLSearchParams(location.search);
const slug = params.get("p");
const order = sortedProjects();
const project = order.find(x => x.slug === slug) || order[0];

const layout = document.getElementById("layout");

const gifPath = cydGifPath(project);
const cydCreditHtml = project.cyd ? `
  <div class="info-credit">
    <span class="info-credit-label">Minted through Cypherdudes</span>
    <span class="info-credit-value">CYD #${project.cyd.id} ${project.cyd.name}</span>
  </div>
  ${gifPath ? `<img class="info-cyd-gif" src="${gifPath.split("/").map(encodeURIComponent).join("/")}" alt="Cypherdude #${project.cyd.id} ${project.cyd.name}">` : ""}
` : "";

const infoCol = document.createElement("div");
infoCol.className = "info-col";
infoCol.innerHTML = `
  <div class="info-title-row">
    <h1 class="info-title">${project.title}</h1>
    <div class="release-badge${project.release.sortValue === Infinity ? " is-upcoming" : project.release.label === "JUST MINTED" ? " is-minted" : ""}">${project.release.label}</div>
  </div>
  <div class="info-meta">${project.meta}</div>
  <p class="info-preview">${project.statement[0]}</p>
  <div class="info-expand">
    <div class="info-statement">
      ${project.statement.slice(1).map(p => `<p>${p}</p>`).join("")}
    </div>
    ${cydCreditHtml}
    <div class="info-hint">Scroll the pieces on the right. Each frame is a live, interactive page — click into it.</div>
  </div>
  <button class="info-expand-toggle" aria-expanded="false" aria-label="Show full description">
    <span class="info-expand-label">+ Info</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 9l6 6 6-6"/>
    </svg>
  </button>
`;

const infoExpandToggle = infoCol.querySelector(".info-expand-toggle");
const infoExpandLabel = infoCol.querySelector(".info-expand-label");
const infoExpand = infoCol.querySelector(".info-expand");
infoExpandToggle.addEventListener("click", () => {
  const open = infoExpand.classList.toggle("is-open");
  infoExpandToggle.classList.toggle("is-open", open);
  infoCol.classList.toggle("is-expanded", open);
  infoExpandToggle.setAttribute("aria-expanded", String(open));
  infoExpandToggle.setAttribute("aria-label", open ? "Hide full description" : "Show full description");
  infoExpandLabel.textContent = open ? "- Info" : "+ Info";
});

const carouselCol = document.createElement("div");
carouselCol.className = "carousel-col";

const size = frameSizeOf(project);
const supply = project.pieces.length - 1; // pieces[0] is always the intro, not a numbered edition
function cardLabel(piece){
  if (project.slug === "cydbros") return piece.label;
  return piece.label.replace(/#(\d+)/, (m, n) => `#${n}/${supply}`);
}
const cardsHtml = project.pieces.map((piece, i) => `
  <div class="card">
    <div class="card-frame">
      <iframe src="${project.folder}${piece.file}" width="${size.w}" height="${size.h}"
              scrolling="no" title="${piece.label}"></iframe>
    </div>
    <div class="card-footer">
      <span class="card-label">${cardLabel(piece)}</span>
      <span class="card-actions">
        <button class="icon-btn like-btn" data-like-key="${project.slug}-${piece.file}" data-piece-index="${i}" aria-label="Like this piece" title="Like">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
        </button>
        <button class="icon-btn source-btn" data-index="${i}" aria-label="View source code" title="View source code">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <path d="M14 2v6h6"/>
          </svg>
        </button>
        <button class="icon-btn fs-btn" data-index="${i}" aria-label="View fullscreen" title="View fullscreen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>
          </svg>
        </button>
        <a class="opensea-link" href="${openseaUrl(piece.token)}" target="_blank" rel="noopener" data-token="${piece.token}">
          <img src="opensea-icon.png" alt="OpenSea">
          <span class="opensea-link-text">BUY ON OPENSEA</span>
        </a>
      </span>
    </div>
    <div class="card-easter-egg"></div>
    <div class="card-owner" data-token="${piece.token}"></div>
  </div>
`).join("");

const chevron = (dir) => `
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="${dir === "left" ? "M15 5l-7 7 7 7" : "M9 5l7 7-7 7"}"/>
  </svg>
`;

carouselCol.innerHTML = `
  <div class="carousel-viewport">
    <button class="carousel-nav prev" aria-label="Scroll left">&#8249;</button>
    <div class="carousel">${cardsHtml}</div>
    <button class="carousel-nav next" aria-label="Scroll right">&#8250;</button>
  </div>
  <div class="carousel-below-nav">
    <button class="big-nav-btn prev" aria-label="Previous piece">${chevron("left")}</button>
    <button class="big-nav-btn next" aria-label="Next piece">${chevron("right")}</button>
  </div>
`;

layout.appendChild(infoCol);
layout.appendChild(carouselCol);

const track = carouselCol.querySelector(".carousel");
function scrollCarousel(dir){
  const card = track.querySelector(".card");
  const step = card ? card.getBoundingClientRect().width + 28 : 540;
  track.scrollBy({left: dir * step, behavior:"smooth"});
}
carouselCol.querySelectorAll(".prev").forEach(btn => btn.addEventListener("click", () => scrollCarousel(-1)));
carouselCol.querySelectorAll(".next").forEach(btn => btn.addEventListener("click", () => scrollCarousel(1)));

/* Cards are sized for desktop (490px wide). On a phone screen that's wider
   than the viewport, cropping the NFT and hiding the buttons off-screen —
   so below the 900px breakpoint we shrink each whole card with zoom (which
   resizes it for layout too, unlike transform) to fit the screen. */
function scaleCardsForMobile(){
  const isMobile = window.matchMedia("(max-width: 900px)").matches;
  const cards = carouselCol.querySelectorAll(".card");
  if (!isMobile) {
    cards.forEach(c => { c.style.zoom = ""; });
    return;
  }
  const available = window.innerWidth - 32;
  const scale = Math.min(1, available / 490);
  cards.forEach(c => { c.style.zoom = scale; });
}
scaleCardsForMobile();
window.addEventListener("resize", scaleCardsForMobile);

/* Anywhere on this page, scrolling should move the carousel horizontally —
   over the info column, the gaps, or a piece's own iframe — instead of
   scrolling the page vertically. */
function redirectWheelToTrack(e){
  if (!modal.hidden || !sourceModal.hidden) return; // a modal is open: leave its own scrolling alone
  track.scrollLeft += (e.deltaY !== 0 ? e.deltaY : e.deltaX);
  e.preventDefault();
}
document.addEventListener("wheel", redirectWheelToTrack, { passive:false });

/* Each card is mostly filled by an iframe (a separate document), so a wheel
   event over it never reaches the listener above — the browser just chains
   the scroll to the outer page instead. These are same-origin local files,
   so we can reach into each iframe and forward its wheel events here too. */
carouselCol.querySelectorAll(".card-frame iframe").forEach(frame => {
  const attach = () => {
    try {
      frame.contentWindow.addEventListener("wheel", redirectWheelToTrack, { passive:false });
    } catch (err) { /* cross-origin fallback: leave native scroll behavior */ }
  };
  frame.addEventListener("load", attach);
  if (frame.contentDocument && frame.contentDocument.readyState === "complete") attach();
});

/* ---------- fullscreen modal ---------- */
const modal = document.createElement("div");
modal.className = "fs-modal";
modal.hidden = true;
modal.innerHTML = `
  <div class="fs-modal-frame">
    <button class="fs-close" aria-label="Close">&times;</button>
    <iframe scrolling="no"></iframe>
  </div>
`;
document.body.appendChild(modal);
const modalFrame = modal.querySelector(".fs-modal-frame");
const modalIframe = modal.querySelector("iframe");
const FS_ZOOM = 1.5;

function openFullscreen(piece){
  modalIframe.src = project.folder + piece.file;
  modalIframe.title = piece.label;
  modalIframe.style.width = size.w + "px";
  modalIframe.style.height = size.h + "px";

  const isMobile = window.matchMedia("(max-width: 900px)").matches;
  if (isMobile) {
    // On phones the piece must always fit fully on screen, so we scale it
    // down (or up) with zoom — which shrinks the layout box too, unlike
    // transform — to whatever fits, instead of the fixed desktop zoom-in.
    const zoom = Math.min((window.innerWidth * 0.92) / size.w, (window.innerHeight * 0.88) / size.h);
    modalIframe.style.transform = "none";
    modalIframe.style.zoom = zoom;
    modalFrame.style.width = Math.round(size.w * zoom) + "px";
    modalFrame.style.height = Math.round(size.h * zoom) + "px";
  } else {
    modalIframe.style.transform = "";
    modalIframe.style.zoom = "";
    modalFrame.style.width = Math.round(size.w * FS_ZOOM) + "px";
    modalFrame.style.height = Math.round(size.h * FS_ZOOM) + "px";
  }
  modal.hidden = false;
}
function closeFullscreen(){
  modal.hidden = true;
  modalIframe.src = "about:blank";
}

carouselCol.querySelectorAll(".fs-btn").forEach(btn => {
  btn.addEventListener("click", () => openFullscreen(project.pieces[+btn.dataset.index]));
});
modal.querySelector(".fs-close").addEventListener("click", closeFullscreen);
modal.addEventListener("click", e => { if (e.target === modal) closeFullscreen(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !modal.hidden) closeFullscreen(); });

/* ---------- source code modal ---------- */
const sourceModal = document.createElement("div");
sourceModal.className = "source-modal";
sourceModal.hidden = true;
sourceModal.innerHTML = `
  <div class="source-modal-frame">
    <div class="source-modal-header">
      <div class="source-modal-header-left">
        <span class="source-modal-title"></span>
        <span class="release-badge is-upcoming">Fully onchain</span>
        <span class="release-badge is-upcoming">Ethereum</span>
      </div>
      <button class="fs-close" aria-label="Close">&times;</button>
    </div>
    <pre class="source-modal-code"><code></code></pre>
  </div>
`;
document.body.appendChild(sourceModal);
const sourceModalTitle = sourceModal.querySelector(".source-modal-title");
const sourceModalCode = sourceModal.querySelector("code");

function closeSource(){
  sourceModal.hidden = true;
}

function openSource(piece){
  sourceModalTitle.textContent = piece.label;
  const url = project.folder + piece.file;
  sourceModalCode.textContent = SOURCE_CODE[url] || "Could not load source for this piece.";
  sourceModal.hidden = false;
}

carouselCol.querySelectorAll(".source-btn").forEach(btn => {
  btn.addEventListener("click", () => openSource(project.pieces[+btn.dataset.index]));
});
sourceModal.querySelector(".fs-close").addEventListener("click", closeSource);
sourceModal.addEventListener("click", e => { if (e.target === sourceModal) closeSource(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !sourceModal.hidden) closeSource(); });

/* ---------- likes (stored in a cookie, so they persist across visits) ---------- */
function getLikedKeys(){
  const match = document.cookie.match(/(?:^|; )mc7026_likes=([^;]*)/);
  const raw = match ? decodeURIComponent(match[1]) : "";
  return new Set(raw ? raw.split(",") : []);
}
function saveLikedKeys(keys){
  const oneYear = 60 * 60 * 24 * 365;
  document.cookie = `mc7026_likes=${encodeURIComponent(Array.from(keys).join(","))}; path=/; max-age=${oneYear}`;
}

/* A burst of filled hearts twirls from the like button out around the
   center of the piece it just liked, staying solid almost the whole way
   before fading right at the end. Purely decorative, removed once done. */
function flyHeartToCard(btn){
  const frame = btn.closest(".card").querySelector(".card-frame");
  const from = btn.getBoundingClientRect();
  const to = frame.getBoundingClientRect();
  const fromX = from.left + from.width / 2;
  const fromY = from.top + from.height / 2;
  const centerX = to.left + to.width / 2;
  const centerY = to.top + to.height / 2;

  const HEART_COUNT = 7;
  for (let i = 0; i < HEART_COUNT; i++) {
    const heart = document.createElement("div");
    heart.className = "flying-heart";
    heart.innerHTML = `<svg viewBox="0 0 24 24" fill="#ff4d6d"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;
    heart.style.left = fromX + "px";
    heart.style.top = fromY + "px";
    document.body.appendChild(heart);

    const angle = (i / HEART_COUNT) * Math.PI * 2 + Math.random() * 0.8;
    const radius = Math.min(to.width, to.height) * (0.18 + Math.random() * 0.22);
    const dx = (centerX + Math.cos(angle) * radius) - fromX;
    const dy = (centerY + Math.sin(angle) * radius) - fromY;
    const spin = (Math.random() < 0.5 ? -1 : 1) * (360 + Math.random() * 360);
    const scale = 2.6 + Math.random() * 1.6;

    const anim = heart.animate([
      { transform: "translate(-50%, -50%) translate(0, 0) scale(0.8) rotate(0deg)", opacity: 1, offset: 0 },
      { transform: `translate(-50%, -50%) translate(${dx}px, ${dy}px) scale(${scale}) rotate(${spin}deg)`, opacity: 1, offset: 0.65 },
      { transform: `translate(-50%, -50%) translate(${dx}px, ${dy}px) scale(${scale * 1.15}) rotate(${spin}deg)`, opacity: 0, offset: 1 }
    ], { duration: 750 + Math.random() * 250, delay: i * 35, easing: "cubic-bezier(.2,.8,.2,1)", fill: "forwards" });
    anim.onfinish = () => heart.remove();
  }
}

/* Easter egg: liking the very last piece of a project reveals a hidden
   line under its title (and, for BRUIT, a little retro beep). */
const LAST_PIECE_EASTER_EGGS = {
  eggs: "WE LIKE EGGS! 🥚",
  dgl: "MADE WITH REAL LOVE! ❤️",
  noise: "GG DAN POLKO! TURN SOUNDS ON 🔊",
  cydbros: "You drink a Phoenix Down (HP+MP MAX) => YOU WIN !!!",
  centralian: "YOU SEE YOURSELF SEE YOU",
  ogaka: "PRIVATE ARCHIVES CAN REVEAL SECRETS. SOLVE CLUES FOR +2 EXTRA",
};
function playRetroBeep(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "square";
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.18);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.18);
  } catch (err) {}
}
function revealLastPieceEasterEgg(btn, playSound){
  if (Number(btn.dataset.pieceIndex) !== project.pieces.length - 1) return;
  const message = LAST_PIECE_EASTER_EGGS[project.slug];
  const eggEl = btn.closest(".card").querySelector(".card-easter-egg");
  if (!message || !eggEl) return;
  eggEl.textContent = message;
  eggEl.classList.add("is-visible");
  if (playSound && project.slug === "noise") playRetroBeep();
}

const likedKeys = getLikedKeys();
carouselCol.querySelectorAll(".like-btn").forEach(btn => {
  const key = btn.dataset.likeKey;
  if (likedKeys.has(key)) {
    btn.classList.add("is-liked");
    revealLastPieceEasterEgg(btn, false);
  }
  btn.addEventListener("click", () => {
    const nowLiked = btn.classList.toggle("is-liked");
    if (nowLiked) {
      likedKeys.add(key);
      flyHeartToCard(btn);
      revealLastPieceEasterEgg(btn, true);
    } else {
      likedKeys.delete(key);
    }
    saveLikedKeys(likedKeys);
  });
});

/* ---------- live OpenSea price + owner ---------- */
function truncateAddress(addr) {
  return addr.slice(0, 6) + "…" + addr.slice(-4);
}

async function loadOpenSeaInfoForPieces() {
  const realPieces = project.pieces.filter(p => p.token && p.token !== "XXX");
  for (const piece of realPieces) {
    const link = carouselCol.querySelector(`.opensea-link[data-token="${piece.token}"]`);
    const ownerEl = carouselCol.querySelector(`.card-owner[data-token="${piece.token}"]`);
    if (!link) continue;

    const info = await getOpenSeaInfoCached(piece.token);

    const textEl = link.querySelector(".opensea-link-text");
    if (info.listing) {
      textEl.textContent = `BUY FOR ${info.listing.amount} ${info.listing.currency}`;
    } else {
      textEl.textContent = "MAKE OFFER";
    }

    if (info.owner && ownerEl) {
      ownerEl.innerHTML = `OWNED BY <a href="https://opensea.io/${info.owner}" target="_blank" rel="noopener">${truncateAddress(info.owner)}</a>`;
    }

    await new Promise(r => setTimeout(r, 400)); // stay well under the API rate limit
  }
}
loadOpenSeaInfoForPieces();

/* Deep link from the "My Collection" page/panel or the header search:
   ?open=<file> jumps straight to that piece's fullscreen view. Matched by
   file name rather than token since not-yet-minted pieces (OGA³) all share
   the placeholder token "XXX" and wouldn't resolve to a unique piece. */
const openFile = params.get("open");
if (openFile) {
  const openIndex = project.pieces.findIndex(p => p.file === openFile);
  if (openIndex !== -1) {
    const openCard = track.querySelectorAll(".card")[openIndex];
    if (openCard) openCard.scrollIntoView({ inline: "center", block: "nearest" });
    openFullscreen(project.pieces[openIndex]);
  }
}
</script>
