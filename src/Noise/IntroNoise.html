<script>
(() => {
  // ===== CONSTANTES =====
  const widthVal = 470;
  const heightVal = 350;

  const tube = document.getElementById('tube');
  const image = document.getElementById('image');
  const source = document.getElementById('source');

  const tubeCtx  = tube.getContext('2d');
  const imageCtx = image.getContext('2d');

  // ===== BRUIT TV =====
  function tvStatic() {
    const frameData = tubeCtx.createImageData(widthVal, heightVal);
    const pixArr = frameData.data;

    for (let i = 0; i < pixArr.length; i += 4) {
      const grain = 15 + (Math.random() * 220 | 0);
      pixArr[i] = pixArr[i+1] = pixArr[i+2] = grain;
      pixArr[i+3] = 255;
    }

    tubeCtx.putImageData(frameData, 0, 0);
    tubeCtx.globalAlpha = 0.08;
    tubeCtx.fillRect(0, 0, widthVal, heightVal);
    tubeCtx.globalAlpha = 1;

    requestAnimationFrame(tvStatic);
  }
  tvStatic();

  // ===== IMAGE BASE64 PAR-DESSUS =====
  source.onload = () => {
    imageCtx.clearRect(0, 0, widthVal, heightVal);
    imageCtx.drawImage(source, 0, 0, widthVal, heightVal);
  };

  // Si l'image est déjà chargée (cache), forcer le rendu
  if (source.complete && source.naturalWidth !== 0) {
    source.onload();
  }

})();
</script>
