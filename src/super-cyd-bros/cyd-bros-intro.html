function drawBandCyd(cvs,D){var ctx=cvs.getContext('2d');D.split('').forEach(function(v,i){ctx.fillStyle=colorscyd[v]||'#000';var col=(i%Wcyd)*Scyd,row=Math.floor(i/Wcyd)*Scyd;ctx.fillRect(col,row,Scyd,Scyd);ctx.fillRect(Wcyd*Scyd+col,row,Scyd,Scyd);});}

document.getElementById('txcyd').textContent='SUPER CYD BROS IS A FULLY ONCHAIN CRYPTOART SERIES OF 9 UNIQUE PIXEL PLATFORM LEVELS, PERMANENTLY STORED ON THE BLOCKCHAIN.    FROM THE SHROOM FIELDS OF WORLD 1 TO LEAK CITY OF WORLD 3, EACH LEVEL EXPRESSES A DISTINCT CHROMATIC VISION AND ATMOSPHERIC IDENTITY.    3 WORLDS x 3 LEVELS EACH. ONE INFINITE SCROLL.    IMMUTABLE, DECENTRALIZED, CODED ARTWORKS MADE BY MOONCAT7026.    SUPER CYD BROS.';
var offtcyd=0,offbcyd=0,offtxcyd=470,tileWcyd=Wcyd*Scyd,lastTscyd=null;
function scrollCyd(ts){if(lastTscyd===null)lastTscyd=ts;var dt=ts-lastTscyd;lastTscyd=ts;offtcyd=(offtcyd+60*dt/1000)%tileWcyd;document.getElementById('ctcyd').style.left='-'+Math.floor(offtcyd)+'px';offbcyd=(offbcyd+60*dt/1000)%tileWcyd;document.getElementById('cbcyd').style.left='-'+Math.floor(offbcyd)+'px';offtxcyd-=100*dt/1000;if(offtxcyd<-document.getElementById('txcyd').offsetWidth)offtxcyd=470;document.getElementById('txcyd').style.left=Math.floor(offtxcyd)+'px';requestAnimationFrame(scrollCyd);}
