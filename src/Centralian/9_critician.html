<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>CRITICIAN</title>
<style>
.cwid{ --crm:#efe6d2; --crd:#d8cbac; --crk:#c2b391; --ink:#2a2420; --stn:#b7b0a2; --std:#8f8878; --stk:#6b6558; --bst:#c7c3ba; --bsd:#9b968a; --bsk:#726d62; --ppr:#f2ead6; --ppd:#cfc6ab; display:inline-block; }
.cwid, .wmrk{ font-family:Consolas,'Courier New',monospace; }
.cwid *{ box-sizing:border-box; }
.pstr::before, .frbd, .aare, .scn, .flsh, .jeer, .pdgr, .pdst::before, .cpnl, .gls, .nbk, .nbk span, .magn, .mgls, .mghd, .sbub, .sbub::before, .sbub::after, .tape, .tape::after, .cnft, .emk, .wmar{ position:absolute; }
.pstr, .crig, .stge, .pdst{ position:relative; }
.pdgr, .crig, .gls, .sbub, .wmar{ display:flex; }
.pdgr, .crig, .wmar{ flex-direction:column; }
.pdgr, .crig, .sbub, .wmar{ align-items:center; }
.sbub, .wmar{ justify-content:center; }
.flsh, .pdgr, .gls, .cp1, .cp2, .tape, .emk{ left:50%; }
.flsh, .pdgr, .gls, .cp1, .cp2, .emk{ transform:translateX(-50%); }
.cp1, .lens, .mgls{ border-radius:50%; }
.tape, .emk, .wmrk{ cursor:pointer; }
.jeer, .sbub, .wmrk{ font-weight:700; }
.nbk, .pdst::before, .sbub{ box-shadow:inset 0 0 0 2px var(--ink); }
.cp2, .cp3{ background:var(--bsd); }
.pstr{ width:450px; height:340px; background:radial-gradient(ellipse at 50% 38%, #f7efdc 0%, #ede2ca 55%, #d9caa9 100%); overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.45); }
.pstr::before{ content:""; inset:0; background-image:repeating-linear-gradient(0deg, rgba(0,0,0,.035) 0 1px, transparent 1px 4px), repeating-linear-gradient(90deg, rgba(0,0,0,.02) 0 1px, transparent 1px 4px); mix-blend-mode:multiply; pointer-events:none; }
.frbd{ inset:0; border:6px solid var(--ink); box-shadow:inset 0 0 0 3px var(--crm), inset 0 0 0 6px var(--ink); pointer-events:none; }
.aare{ top:14px; left:14px; right:14px; bottom:110px; overflow:hidden; }
.rtgl{ display:none; }
.scn{ inset:0; }
.flsh{ bottom:14px; width:160px; height:18px; background:radial-gradient(ellipse at center, rgba(30,25,20,.42) 0%, rgba(30,25,20,0) 72%); }
.jeer{ white-space:nowrap; pointer-events:none; text-shadow:1px 1px 0 rgba(0,0,0,.25); }
.pdgr{ bottom:20px; }
.crig{ width:160px; }
.stge{ width:110px; height:114px; margin:0 auto; }
.pdst{ width:110px; height:34px; margin:0 auto; background:var(--stn); box-shadow:inset 0 0 0 4px var(--std), inset 0 0 0 7px var(--ink); }
.pdst::before{ content:""; top:-6px; left:-6px; right:-6px; height:6px; background:var(--std); }
.cpnl{ transition:none; }
.cp1{ top:0; width:44px; height:44px; background:var(--bst); box-shadow:inset 0 0 0 4px var(--bsd), inset 0 0 0 7px var(--ink); }
.gls{ top:16px; width:26px; height:8px; justify-content:space-between; }
.lens{ width:10px; height:8px; border:2px solid var(--ink); background:rgba(255,255,255,.25); }
.cp2{ top:38px; width:96px; height:76px; clip-path:polygon(22% 0,78% 0,100% 100%,0% 100%); box-shadow:inset 0 0 0 4px var(--bsk), inset 0 0 0 7px var(--ink); }
.nbk{ bottom:8px; right:10px; width:16px; height:22px; background:var(--ppr); }
.nbk span{ left:3px; right:3px; height:1px; background:var(--ink); opacity:.55; }
.nbk span:nth-child(1){ top:5px; }
.nbk span:nth-child(2){ top:10px; }
.nbk span:nth-child(3){ top:15px; }
.cp3{ top:48px; left:calc(50% + 40px); width:16px; height:56px; border-radius:4px; box-shadow:inset 0 0 0 3px var(--bsk), inset 0 0 0 5px var(--ink); }
.magn{ top:2px; left:-8px; }
.mgls{ width:14px; height:14px; border:3px solid var(--ink); background:rgba(255,255,255,.18); }
.mghd{ top:12px; left:5px; width:3px; height:12px; background:var(--ink); transform:rotate(42deg); transform-origin:top left; }
.sbub{ top:-22px; left:62px; width:34px; height:20px; background:var(--crm); border-radius:6px; font-size:11px; letter-spacing:1px; color:var(--ink); z-index:5; transition:opacity .3s ease, transform .3s ease; }
.sbub::before{ content:""; bottom:-9px; left:10px; border:7px solid transparent; border-top-color:var(--ink); }
.sbub::after{ content:""; bottom:-5.5px; left:12px; border:5px solid transparent; border-top-color:var(--crm); }
.tape{ top:58px; width:132px; height:38px; transform:translate(-50%,-50%) rotate(-15deg); background:repeating-linear-gradient(45deg, rgba(255,255,255,.22) 0 3px, rgba(0,0,0,.06) 3px 6px), linear-gradient(180deg, #a8a8a8 0%, #8f8f8f 45%, #7a7a7a 100%); box-shadow:0 4px 10px rgba(0,0,0,.35), inset 0 0 0 1px rgba(0,0,0,.15); z-index:6; transition:opacity .4s; }
.tape::after{ content:""; top:6px; left:0; right:0; height:5px; background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.55), rgba(255,255,255,0)); }
.cnft{ width:14px; height:6px; background:var(--ppd); box-shadow:inset 0 0 0 1px rgba(0,0,0,.22); opacity:0; }
.cn1{ top:60px; left:6px; }
.cn2{ top:82px; left:132px; }
.cn3{ top:104px; left:22px; }
.cn4{ top:126px; left:118px; }
#rc:checked ~ .aare .tape{ opacity:0; pointer-events:none; }
#rc:checked ~ .aare .sbub{ opacity:0; transform:translateY(-14px); }
#rc:checked ~ .aare .cp1{ animation:t1 900ms ease-in forwards; }
#rc:checked ~ .aare .cp2{ animation:t2 1000ms ease-in 60ms forwards; }
#rc:checked ~ .aare .cp3{ animation:t3 850ms ease-in 30ms forwards; }
@keyframes t1{ 0%{ transform:translateX(-50%) translate(0,0) rotate(0deg); opacity:1; } 100%{ transform:translateX(-50%) translate(-50px,-92px) rotate(-42deg); opacity:0; } }
@keyframes t2{ 0%{ transform:translateX(-50%) translate(0,0) rotate(0deg); opacity:1; } 100%{ transform:translateX(-50%) translate(56px,104px) rotate(33deg); opacity:0; } }
@keyframes t3{ 0%{ transform:translate(0,0) rotate(0deg); opacity:1; } 100%{ transform:translate(60px,70px) rotate(32deg); opacity:0; } }
#rc:checked ~ .aare .cn1{ animation:f1 1200ms ease-in 80ms forwards; }
#rc:checked ~ .aare .cn2{ animation:f2 1150ms ease-in 180ms forwards; }
#rc:checked ~ .aare .cn3{ animation:f3 1300ms ease-in 260ms forwards; }
#rc:checked ~ .aare .cn4{ animation:f4 1250ms ease-in 340ms forwards; }
@keyframes f1{ 0%{ transform:translate(0,0) rotate(0deg); opacity:0; } 50%{ transform:translate(-22px,58px) rotate(150deg); opacity:.8; } 100%{ transform:translate(-34px,128px) rotate(270deg); opacity:0; } }
@keyframes f2{ 0%{ transform:translate(0,0) rotate(10deg); opacity:0; } 50%{ transform:translate(26px,64px) rotate(-160deg); opacity:.8; } 100%{ transform:translate(40px,132px) rotate(-290deg); opacity:0; } }
@keyframes f3{ 0%{ transform:translate(0,0) rotate(-8deg); opacity:0; } 50%{ transform:translate(-14px,50px) rotate(120deg); opacity:.75; } 100%{ transform:translate(-24px,120px) rotate(240deg); opacity:0; } }
@keyframes f4{ 0%{ transform:translate(0,0) rotate(6deg); opacity:0; } 50%{ transform:translate(18px,54px) rotate(-130deg); opacity:.75; } 100%{ transform:translate(30px,124px) rotate(-250deg); opacity:0; } }
.emk{ bottom:58px; font-size:13px; font-weight:900; letter-spacing:2px; color:var(--ink); text-align:center; line-height:1.3; opacity:0; z-index:5; transition:opacity .5s ease 1.85s; }
#rc:checked ~ .aare .emk{ opacity:.6; }
.noan, .noan *{ transition:none !important; }
.wmar{ left:0; right:0; bottom:14px; height:96px; }
.wmrk{ text-transform:uppercase; font-size:34px; letter-spacing:3px; margin:0; transform:translateY(-12px); background:linear-gradient(180deg, #e0303a 0%, #ff8a00 50%, #7cff2f 100%); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(2px 0 0 var(--ink)) drop-shadow(0 2px 0 var(--ink)) drop-shadow(4px 4px 0 rgba(0,0,0,.25)); }
.ctag{ position:absolute; bottom:20px; right:26px; font-size:15px; font-weight:900; letter-spacing:2px; color:#000; z-index:2; pointer-events:none; }
</style>
</head>
<body>
<div class="cwid"><div class="pstr"><input type="checkbox" id="rc" class="rtgl"><div class="aare"><div class="scn"><div class="jeer" style="left:8px;top:14px;font-size:16px;color:#e0303a;transform:rotate(-8deg)">THIS IS NOT ART</div><div class="jeer" style="right:10px;top:10px;font-size:12px;color:#ff2fa0;transform:rotate(6deg)">RUG PULL INCOMING</div><div class="jeer" style="left:30px;top:70px;font-size:10px;color:#ff8a00;transform:rotate(-4deg)">MY KID DREW BETTER</div><div class="jeer" style="right:26px;top:56px;font-size:26px;color:#7cff2f;transform:rotate(14deg)">NGMI</div><div class="jeer" style="left:10px;bottom:60px;font-size:13px;color:#b83fff;transform:rotate(-10deg)">WORTHLESS JPEG</div><div class="jeer" style="right:14px;bottom:70px;font-size:18px;color:#e0303a;transform:rotate(7deg)">DELETE THIS</div><div class="jeer" style="left:150px;top:6px;font-size:9px;color:#ff2fa0;transform:rotate(-6deg)">LOL</div><div class="jeer" style="left:14px;bottom:16px;font-size:11px;color:#7cff2f;transform:rotate(9deg)">STILL NOT ART</div><div class="jeer" style="right:8px;bottom:14px;font-size:14px;color:#ff8a00;transform:rotate(-13deg)">PONZI ART LOL</div><div class="jeer" style="right:36px;top:32px;font-size:11px;color:#000;transform:rotate(5deg)">FELIX, NEVER HEARD!</div><div class="jeer" style="left:58px;bottom:38px;font-size:15px;color:#000;transform:rotate(-9deg)">CYD IS SHIT</div><div class="jeer" style="right:64px;bottom:36px;font-size:13px;color:#000;transform:rotate(11deg)">0 SKILLS</div><div class="jeer" style="right:4px;bottom:96px;font-size:9px;color:#000;transform:rotate(-5deg)">ONCHAIN ART IS VOMIT</div><div class="jeer" style="left:172px;bottom:6px;font-size:10px;color:#000;transform:rotate(4deg)">CABAL DUDES</div><div class="jeer" style="left:2px;top:44px;font-size:8px;color:#000;transform:rotate(-3deg)">ARCHIVES ARE BULLSHIT</div><div class="jeer" style="left:4px;top:100px;font-size:12px;color:#000;transform:rotate(+20deg)">BROKEN D.O.S</div><div class="flsh"></div><div class="pdgr"><div class="crig"><div class="stge"><div class="cpnl cp1"><div class="gls"><span class="lens"></span><span class="lens"></span></div></div><div class="cpnl cp2"><div class="nbk"><span></span><span></span><span></span></div></div><div class="cpnl cp3"><div class="magn"><span class="mgls"></span><span class="mghd"></span></div></div><div class="sbub"><span>...</span></div></div><div class="pdst"></div><label class="tape" for="rc"></label><div class="cnft cn1"></div><div class="cnft cn2"></div><div class="cnft cn3"></div><div class="cnft cn4"></div></div></div><div class="emk">SHHH,<br>NO COMMENT</div></div></div><div class="wmar"><h1 class="wmrk">CRITICIAN</h1></div><div class="frbd"></div><div class="ctag">CENTRALIAN 9/10</div></div></div>
<script>
var releaseCritic = document.getElementById('rc');
var poster = document.querySelector('.cwid .pstr');
document.addEventListener('keydown', function(e){ if(e.key === 'Enter') releaseCritic.checked = !releaseCritic.checked; });
function resetInstant(){
  poster.classList.add('noan');
  releaseCritic.checked = false;
  void poster.offsetWidth;

</script>
