<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>SOCIALIAN</title>
<style>.socw{--crm:#efe6d2;--crd:#d8cbac;--crk:#c2b391;--ink:#2a2420;--blu:#2f6fb8;--bld:#215086;--blk:#173a63;--ylw:#e8c94a;--yld:#b89a2e;--org:#e2823a;--ord:#b5601f;--red:#d1503f;--rdd:#a13527;--grn:#4c9a5b;--grd:#327441;--car:#c94b6b;--cad:#943652;display:inline-block;}.socw *{box-sizing:border-box;}.pstr{width:450px;height:340px;background:radial-gradient(ellipse at 50% 38%, #f7efdc 0%, #ede2ca 55%, #d9caa9 100%);box-shadow:0 10px 30px rgba(0,0,0,.45);}.pstr::before{content:"";inset:0;background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,.035) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.02) 0 1px, transparent 1px 4px);pointer-events:none;}.frbd{inset:0;border:6px solid var(--ink);box-shadow:inset 0 0 0 3px var(--crm), inset 0 0 0 6px var(--ink);pointer-events:none;}.arar{top:14px;left:14px;right:14px;bottom:110px;}.rtgl{display:none;}.strt{inset:0;}.road{left:0;right:0;bottom:0;height:18px;background:#3a3632;box-shadow:inset 0 2px 0 var(--ink);z-index:3;}.road::before{content:"";left:0;right:0;top:8px;height:2px;background:repeating-linear-gradient(90deg, #e8d9a8 0 10px, transparent 10px 20px);}.swlk{left:0;right:0;bottom:18px;height:22px;background:var(--crk);box-shadow:inset 0 2px 0 var(--ink), inset 0 0 0 2px var(--crd);z-index:3;}.skyl{left:0;right:0;bottom:40px;align-items:flex-end;gap:7px;}.bldg{background-image:repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0 2px, transparent 2px 22px);}.bldg::before{content:"";inset:5px;background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,.32) 0 2px, transparent 2px 15px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.26) 0 2px, transparent 2px 13px);}.bldg::after{content:"";top:-4px;left:5px;right:5px;height:4px;opacity:.7;}.bg1{width:56px;height:96px;background-color:var(--ylw);box-shadow:inset 0 0 0 3px var(--yld), inset 0 0 0 6px var(--ink);}.bsgn{position:absolute;top:8px;left:3px;right:3px;height:14px;background:var(--crm);box-shadow:inset 0 0 0 2px var(--ink);display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;letter-spacing:.5px;white-space:nowrap;z-index:1;}.bg2{width:70px;height:130px;background-color:var(--org);box-shadow:inset 0 0 0 3px var(--ord), inset 0 0 0 6px var(--ink);}.bg3{width:70px;height:112px;background-color:var(--red);box-shadow:inset 0 0 0 3px var(--rdd), inset 0 0 0 6px var(--ink);}.bg4{width:56px;height:78px;background-color:var(--grn);box-shadow:inset 0 0 0 3px var(--grd), inset 0 0 0 6px var(--ink);}.mbld{width:132px;z-index:2;}.bvis{transition:transform 1100ms cubic-bezier(.6,0,.85,.35) 150ms, opacity 400ms ease-in 950ms;}#release-building:checked ~ .arar .bshk{animation:shk 450ms ease-in-out 150ms 2}@keyframes shk{ 0%,100%{ transform:translateX(0) rotate(0deg); } 20%{ transform:translateX(-3px) rotate(-1.5deg); } 40%{ transform:translateX(3px) rotate(1.5deg); } 60%{ transform:translateX(-2px) rotate(-1deg); } 80%{ transform:translateX(2px) rotate(1deg); } }.prpt{height:8px;margin:0 18px;background:var(--bld);}.fcde{width:132px;height:170px;background:var(--blu);box-shadow:inset 0 0 0 4px var(--bld), inset 0 0 0 8px var(--ink);}.fcde::before{content:"";inset:0;background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,.4) 0 2px, transparent 2px 24px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.32) 0 2px, transparent 2px 20px);}.sgbd{top:20px;left:6px;right:6px;height:32px;background:var(--crm);box-shadow:inset 0 0 0 3px var(--ink);z-index:2;}.sgbd span{font-weight:900;font-size:17px;letter-spacing:2px;color:var(--bld);}.door{bottom:0;left:50%;width:30px;height:36px;background:var(--blk);z-index:2;}.tape{left:50%;top:50%;width:190px;height:48px;transform:translate(-50%,-50%) rotate(-18deg);background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.22) 0 3px, rgba(0,0,0,.06) 3px 6px),
      linear-gradient(180deg, #a8a8a8 0%, #8f8f8f 45%, #7a7a7a 100%);box-shadow:0 4px 10px rgba(0,0,0,.35), inset 0 0 0 1px rgba(0,0,0,.15);transition:opacity .4s;}.tape::after{content:"";top:6px;left:0;right:0;height:5px;background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.55), rgba(255,255,255,0));}#release-building:checked ~ .arar .tape{opacity:0; pointer-events:none}#release-building:checked ~ .arar .bvis{transform:translateY(190px); opacity:0}.slmp{right:26px;bottom:40px;width:5px;height:64px;}.slmp::before{content:"";top:-9px;left:50%;width:20px;height:11px;background:#f2e6b8;border-radius:2px 2px 7px 7px;box-shadow:inset 0 0 0 2px var(--ink), 0 0 9px rgba(255,230,150,.65);}.slmp::after{content:"";bottom:-3px;left:50%;width:14px;height:3px;}.car{left:280px;bottom:2px;width:64px;height:27px;}.car .ccab{left:15px;right:15px;bottom:9px;height:14px;background:#ffffff;border-radius:4px 4px 0 0;}.car .cbdy{left:0;right:0;bottom:5px;height:9px;background:var(--car);border-radius:3px;}.car .cwhl{bottom:0;width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--cad);}.car .cwl1{left:9px;}.car .cwr1{right:9px;}.skbd{left:58px;bottom:20px;width:34px;height:8px;}.skbd .deck{left:1px;right:1px;bottom:4px;height:3px;border-radius:2px;}.skbd .skwh{bottom:0;width:5px;height:5px;border-radius:50%;background:#9a9a9a;box-shadow:inset 0 0 0 1px var(--ink);}.skbd .skl1{left:3px;}.skbd .skr1{right:3px;}.empm{left:50%;bottom:24px;font-size:13px;font-weight:900;letter-spacing:2px;color:var(--ink);white-space:nowrap;opacity:0;z-index:5;transition:opacity .5s ease 1.4s;}#release-building:checked ~ .arar .empm{opacity:.6}.noan, .noan *{transition:none !important;}.wmka{left:0;right:0;bottom:14px;height:96px;flex-direction:column;}.wmrk{font-weight:700;text-transform:uppercase;font-size:34px;letter-spacing:3px;margin:0;transform:translateY(-12px);background:linear-gradient(180deg, #1da1f2 0%, #e1306c 50%, #ff0000 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(2px 0 0 var(--ink)) drop-shadow(0 2px 0 var(--ink)) drop-shadow(4px 4px 0 rgba(0,0,0,.25));}.socw,.wmrk{font-family:Consolas,'Courier New',monospace;}.pstr,.bldg,.mbld,.bvis,.prpt,.fcde{position:relative;}.pstr,.arar,.fcde{overflow:hidden;}.pstr::before,.frbd,.arar,.strt,.road,.road::before,.swlk,.skyl,.bldg::before,.bldg::after,.fcde::before,.sgbd,.door,.tape,.tape::after,.slmp,.slmp::before,.slmp::after,.car,.car .ccab,.car .cbdy,.car .cwhl,.skbd,.skbd .deck,.skbd .skwh,.empm,.wmka{position:absolute;}.pstr::before,.bldg::before,.fcde::before{mix-blend-mode:multiply;}.skyl,.sgbd,.wmka{display:flex;}.skyl,.sgbd,.wmka{justify-content:center;}.bldg::after,.slmp,.slmp::after,.car .cwhl,.skbd .deck{background:var(--ink);}.prpt,.door,.car .ccab,.car .cbdy{box-shadow:inset 0 0 0 2px var(--ink);}.sgbd,.wmka{align-items:center;}.door,.slmp::before,.slmp::after,.empm{transform:translateX(-50%);}.tape,.slmp,.car,.skbd{z-index:4;}.tape,.empm,.wmrk{cursor:pointer;}.ctag{position:absolute;bottom:20px;right:26px;font-size:15px;font-weight:900;letter-spacing:2px;color:#000;z-index:2;pointer-events:none;}</style>
</head>
<body><div class="socw"><div class="pstr"><input type="checkbox" id="release-building" class="rtgl"><div class="arar"><div class="strt"><div class="skyl"><div class="bldg bg1"><span class="bsgn" style="color:var(--yld)">INSTA</span></div><div class="bldg bg2"><span class="bsgn" style="color:var(--ord)">TIKTOK</span></div><div class="mbld"><div class="bvis"><div class="bshk"><div class="prpt"></div><div class="fcde"><div class="sgbd"><span>TWITTER</span></div><div class="door"></div></div></div></div><label class="tape" for="release-building"></label></div><div class="bldg bg3"><span class="bsgn" style="color:var(--rdd)">DISCORD</span></div><div class="bldg bg4"><span class="bsgn" style="color:var(--grd)">FB</span></div></div><div class="slmp"></div><div class="skbd"><div class="deck"></div><div class="skwh skl1"></div><div class="skwh skr1"></div></div><div class="car"><div class="ccab"></div><div class="cbdy"></div><div class="cwhl cwl1"></div><div class="cwhl cwr1"></div></div><div class="swlk"></div><div class="road"></div><div class="empm">EMPTY LIFE</div></div></div><div class="wmka"><h1 class="wmrk">SOCIALIAN</h1></div><div class="frbd"></div><div class="ctag">CENTRALIAN 2/10</div></div></div>
<script>
    var releaseBuilding = document.getElementById('release-building');
    var poster = document.querySelector('.socw .pstr');
    document.addEventListener('keydown', function(e){
      if(e.key === 'Enter') releaseBuilding.checked = !releaseBuilding.checked;
    });
    function resetInstant(){
      poster.classList.add('noan');
      releaseBuilding.checked = false;
      void poster.offsetWidth;
      poster.classList.remove('noan');
    }
    document.querySelector('.empm').addEventListener('click', resetInstant);
    document.querySelector('.wmrk').addEventListener('click', function(){
      releaseBuilding.checked = !releaseBuilding.checked;
    });
  </script></body>
</html>
