<script src="data.js?v=81"></script>
<script src="sources.js?v=81"></script>
<script src="wallet.js?v=81"></script>
<script src="easter-eggs.js?v=81"></script>
<script src="search.js?v=81"></script>
<script>
const root = document.getElementById("collectionRoot");

const LOADING_HTML = `
  <p class="wallet-loading">Checking your wallet…</p>
  <img class="wallet-spinner" src="src/others/logo.png" alt="Loading">
`;

function renderChecking() {
  root.innerHTML = LOADING_HTML;
}

function renderPrompt() {
  root.innerHTML = `
    <div class="collection-prompt">
      <p>Connect your wallet to see which MC7026 pieces you own.</p>
      <p class="collection-prompt-note">Read only, all safe :)</p>
      <button id="collectionConnectBtn" class="connect-btn connect-btn--big">CONNECT</button>
    </div>
  `;
  document.getElementById("collectionConnectBtn").addEventListener("click", () => window.MCWallet.connect());
}

async function renderConnected(address) {
  root.innerHTML = `
    <div class="collection-connected">
      <div class="wallet-modal-titlebar">
        <div class="wallet-modal-address">${address}</div>
        <button id="collectionDisconnectBtn" class="disconnect-btn">Disconnect</button>
      </div>
      <div id="collectionBody">${LOADING_HTML}</div>
    </div>
  `;
  document.getElementById("collectionDisconnectBtn").addEventListener("click", () => window.MCWallet.disconnect());
  const owned = await window.MCWallet.fetchOwnedPieces(address);
  window.MCWallet.renderOwnedInto(document.getElementById("collectionBody"), owned);
}

function refresh() {
  const address = window.MCWallet.getAddress();
  if (address) renderConnected(address);
  else renderPrompt();
}

renderChecking();
window.addEventListener("mc-wallet-change", refresh);
window.MCWallet.ready.then(refresh); // covers the initial check, in case it resolved before the listener above was attached
</script>
</body>
