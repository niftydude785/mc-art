<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MC7026 — Onchain Art</title>
<link rel="stylesheet" href="style.css?v=58">
</head>
<body>

<header class="site-header">
  <a class="brand" href="index.html">
    <img class="brand-logo" src="src/others/logo.png" alt="MoonCat logo">
    MC7026 CRYPTOART GALLERY
  </a>
  <span class="header-right">
    <a class="header-link" href="about.html">About</a>
    <a class="header-link" href="fully-onchain.html">Fully Onchain</a>
    <a class="header-link" href="my-collection.html">My Collection</a>
    <button id="connectWalletBtn" class="connect-btn">CONNECT</button>
  </span>
</header>

<main class="project-list" id="project-list"></main>

<footer class="site-footer">
  <span class="footer-text">Fully onchain — Ethereum — MC7026</span>
  <span class="footer-links">
    <a class="footer-icon-link" href="https://x.com/mooncat7026" target="_blank" rel="noopener" aria-label="X (Twitter)">
      <svg viewBox="0 0 24 24"><path d="M18.9 2H22l-7.6 8.7L23.3 22h-6.9l-5.4-6.6L4.8 22H1.7l8.1-9.3L1 2h7.1l4.9 6.1L18.9 2zm-1.2 18h1.9L7.4 4H5.4l12.3 16z"/></svg>
    </a>
    <a class="footer-icon-link" href="https://opensea.io/collection/cypherdudesarchives" target="_blank" rel="noopener" aria-label="OpenSea">
      <img src="opensea-icon.png" alt="OpenSea">
    </a>
  </span>
</footer>

<script src="data.js?v=58"></script>
<script>
const list = document.getElementById("project-list");

function splitTitle(title) {
  const m = title.match(/^(.*?)\s*(\([^)]*\))$/);
  return m ? { main: m[1], suffix: m[2] } : { main: title, suffix: "" };
}

sortedProjects().forEach((p, i) => {
  const size = frameSizeOf(p);
  const boxW = 320, boxH = 220;
  const scale = boxW / size.w;
  const { main, suffix } = splitTitle(p.title);

  const isLocked = p.slug === "ogaka"; // keep this project unlinked from the home page for now
  const row = document.createElement(isLocked ? "div" : "a");
  row.className = "project-row" + (isLocked ? " is-locked" : "");
  if (!isLocked) row.href = "project.html?p=" + p.slug;

  row.innerHTML = `
    <span class="row-index">${String(i + 1).padStart(2, "0")}</span>
    <span class="row-main">
      <span class="row-title-line">
        <span class="row-title">${main}${suffix ? ` <span class="row-title-suffix">${suffix}</span>` : ""}</span>
        <span class="release-badge${p.release.sortValue === Infinity ? " is-upcoming" : ""}">${p.release.label}</span>
      </span>
      <span class="row-meta">${p.meta.replace("ETHEREUM — ", "")}</span>
    </span>
    <span class="row-preview" style="height:${Math.round(size.h*scale)}px">
      <span class="scaler" style="transform:scale(${scale})">
        <iframe src="${p.folder}${p.cover.file}" width="${size.w}" height="${size.h}"
                tabindex="-1" scrolling="no" title="${p.title} preview"></iframe>
      </span>
    </span>
  `;
  list.appendChild(row);
});
</script>
<script src="wallet.js?v=58"></script>
</body>
</html>
